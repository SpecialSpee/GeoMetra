	<script>
(function () {
  const isMobile = /Mobi|Android/i.test(navigator.userAgent);
  const isPortrait = window.innerHeight > window.innerWidth;

  if (isMobile && isPortrait) {
    window.addEventListener("DOMContentLoaded", () => {
      const warning = document.createElement("div");
      warning.id = "orientationWarning";
      warning.style.position = "fixed";
      warning.style.top = "0";
      warning.style.left = "0";
      warning.style.width = "100%";
      warning.style.height = "100%";
      warning.style.backgroundColor = "#000";
      warning.style.color = "#fff";
      warning.style.display = "flex";
      warning.style.justifyContent = "center";
      warning.style.alignItems = "center";
      warning.style.fontSize = "22px";
      warning.style.zIndex = "99999";
      warning.innerText = "Пожалуйста, поверните устройство в альбомную ориентацию";
      document.body.appendChild(warning);
    });

    window.addEventListener("orientationchange", () => {
      const isNowLandscape = window.innerWidth > window.innerHeight;
      if (isNowLandscape) {
        location.reload();
      }
    });
  }
})();
</script>
